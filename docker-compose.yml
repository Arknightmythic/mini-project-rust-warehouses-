services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No healthcheck and nothing depends_on this: a tracing backend must never gate
  # application startup. If Jaeger is down, OTLP export fails quietly and retries
  # while the services keep serving traffic.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"

  postgres-user:
    image: postgres:17-alpine
    container_name: postgres-user
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lokal
      POSTGRES_DB: warehouse_user_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-warehouse:
    image: postgres:17-alpine
    container_name: postgres-warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lokal
      POSTGRES_DB: warehouse_warehouse_db
    restart: unless-stopped
    ports:
      - "5437:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-product:
    image: postgres:17-alpine
    container_name: postgres-product
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lokal
      POSTGRES_DB: warehouse_product_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-inventory:
    image: postgres:17-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lokal
      POSTGRES_DB: warehouse_inventory_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      GRPC_ADDR: 0.0.0.0:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DATABASE_URL: postgresql://postgres:lokal@postgres-user:5432/warehouse_user_db
      DB_MAX_CONNECTIONS: 10
      JWT_SECRET: secret
      JWT_EXPIRATION_MINUTES: 60
      JWT_ISSUER: secret
    ports:
      - "50051:50051"
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50051'"]
      interval: 10s
      timeout: 5s
      retries: 5

  warehouse-service:
    build:
      context: .
      args:
        SERVICE: warehouse-service
    environment:
      GRPC_ADDR: 0.0.0.0:50052
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECS: 60
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DATABASE_URL: postgresql://postgres:lokal@postgres-warehouse:5432/warehouse_warehouse_db
      DB_MAX_CONNECTIONS: 10
    ports:
      - "50052:50052"
    depends_on:
      postgres-warehouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50052'"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      GRPC_ADDR: 0.0.0.0:50053
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECS: 60
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DATABASE_URL: postgresql://postgres:lokal@postgres-product:5432/warehouse_product_db
      DB_MAX_CONNECTIONS: 10
    ports:
      - "50053:50053"
    depends_on:
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50053'"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      GRPC_ADDR: 0.0.0.0:50054
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DATABASE_URL: postgresql://postgres:lokal@postgres-inventory:5432/warehouse_inventory_db
      DB_MAX_CONNECTIONS: 10
      WAREHOUSE_SERVICE_URL: http://warehouse-service:50052
      PRODUCT_SERVICE_URL: http://product-service:50053
    ports:
      - "50054:50054"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      warehouse-service:
        condition: service_started
      product-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50054'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      SERVER_URL: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      SERVER_PORT: 8080
      USER_SERVICE_URL: http://user-service:50051
      WAREHOUSE_SERVICE_URL: http://warehouse-service:50052
      PRODUCT_SERVICE_URL: http://product-service:50053
      INVENTORY_SERVICE_URL: http://inventory-service:50054
      JWT_SECRET: secret
      JWT_ISSUER: secret
    ports:
      - "8080:8080"
    # service_started, not service_healthy: the gateway must boot even when a
    # downstream is broken, otherwise it is only as available as its weakest
    # dependency. Failures surface per route as 503 instead.
    depends_on:
      user-service:
        condition: service_started
      warehouse-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started

  product-seed:
    build:
      context: .
      args:
        SERVICE: product-service
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgresql://postgres:lokal@postgres-product:5432/warehouse_product_db
    depends_on:
      postgres-product:
        condition: service_healthy
    profiles: ["tools"]

  user-seed:
    build:
      context: .
      args:
        SERVICE: user-service
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgresql://postgres:lokal@postgres-user:5432/warehouse_user_db
    depends_on:
      postgres-user:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_user_data:
  postgres_warehouse_data:
  postgres_product_data:
  postgres_inventory_data:
