[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
wms-core = { path = "crates/wms-core" }
wms-proto = { path = "crates/wms-proto" }

anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
http = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# --- gRPC ---
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
tonic-prost-build = "0.14.6"
protox = "0.9.1"

# --- caching ---
# Default features carry no TLS backend, so this does not reintroduce rustls.
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }

# --- observability ---
# Version lockstep matters: all opentelemetry* share 0.32 and tracing-opentelemetry
# sits exactly one minor ahead. Mismatch pulls two copies of opentelemetry and
# produces the "expected trait Tracer, found trait Tracer" error.
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
# default-features = false is mandatory, not stylistic: the defaults drag reqwest
# and rustls back into a tree we deliberately cleared.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 16
