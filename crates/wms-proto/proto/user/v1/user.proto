syntax = "proto3";

package wms.user.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  optional string photo = 4;
  optional string phone = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Role {
  int64 id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  optional string phone = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message GetUserRequest { int64 id = 1; }
message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message UpdateUserRequest {
  int64 id = 1;
  optional string name = 2;
  optional string phone = 3;
  optional string photo = 4;
}

message DeleteUserRequest { int64 id = 1; }

message ListUserRolesRequest { int64 user_id = 1; }
message AssignRoleRequest { int64 user_id = 1; int64 role_id = 2; }
message RemoveRoleRequest { int64 user_id = 1; int64 role_id = 2; }

message ListRolesRequest {}
message ListRolesResponse { repeated Role roles = 1; }
message GetRoleRequest { int64 id = 1; }
message CreateRoleRequest { string name = 1; }
message UpdateRoleRequest { int64 id = 1; string name = 2; }
message DeleteRoleRequest { int64 id = 1; }

service UserService {
  rpc Register(RegisterRequest) returns (User);
  rpc Login(LoginRequest) returns (LoginResponse);

  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);

  rpc ListUserRoles(ListUserRolesRequest) returns (ListRolesResponse);
  rpc AssignRole(AssignRoleRequest) returns (google.protobuf.Empty);
  rpc RemoveRole(RemoveRoleRequest) returns (google.protobuf.Empty);

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(GetRoleRequest) returns (Role);
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
}
